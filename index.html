<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Plan</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg class="sidebar-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
            <line x1="16" y1="6" x2="16" y2="27" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <line x1="7" y1="13" x2="25" y2="13" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span class="sidebar-title">Bible Plan</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggleBtn" type="button" aria-expanded="true" aria-controls="sidebar" aria-label="Close sidebar">
          <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg class="icon-menu" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <button class="sidebar-nav-btn" type="button" title="Calendar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <rect x="3.5" y="5" width="17" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/>
            <line x1="3.5" y1="9.5" x2="20.5" y2="9.5" stroke="currentColor" stroke-width="1.7"/>
            <line x1="8" y1="3" x2="8" y2="7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <line x1="16" y1="3" x2="16" y2="7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span class="sidebar-nav-label">Calendar</span>
        </button>

        <button class="sidebar-nav-btn" type="button" title="Bible">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path d="M4 5.5C4 4.67 4.67 4 5.5 4H12V20H5.5C4.67 20 4 19.33 4 18.5V5.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M20 5.5C20 4.67 19.33 4 18.5 4H12V20H18.5C19.33 20 20 19.33 20 18.5V5.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span class="sidebar-nav-label">Bible</span>
        </button>

        <button class="sidebar-nav-btn" type="button" title="Save">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path d="M5 4.5C5 4.22 5.22 4 5.5 4H15.5L19 7.5V19.5C19 19.78 18.78 20 18.5 20H5.5C5.22 20 5 19.78 5 19.5V4.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <rect x="7.5" y="4" width="7" height="5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="7.5" y="13.5" width="9" height="6" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span class="sidebar-nav-label">Save</span>
        </button>

        <button class="sidebar-nav-btn" type="button" title="Reading Plans">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <rect x="4" y="15.3" width="16" height="3.4" rx="1" stroke="currentColor" stroke-width="1.7"/>
            <rect x="4.8" y="10.6" width="14.4" height="3.4" rx="1" stroke="currentColor" stroke-width="1.7"/>
            <rect x="5.6" y="5.9" width="12.8" height="3.4" rx="1" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span class="sidebar-nav-label">Reading Plans</span>
        </button>
      </nav>
    </aside>

    <div class="app">
    
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="cross-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <line x1="16" y1="6" x2="16" y2="27" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <line x1="7" y1="13" x2="25" y2="13" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>Bible Plan</h1>
          <h4>Read through Scripture daily</h4>
        </div>
      </div>
      <div class="clock">
        <div class="clock-date" id="clockDate">--</div>
        <div class="clock-time" id="clockTime">--:--</div>
      </div>
    </header>

    <!-- Quote Banner -->
    <section class="quote-banner" id="quoteBanner">
      <p class="quote-text" id="quoteText">--</p>
      <p class="quote-source" id="quoteSource"></p>
    </section>

    <!-- Controls -->
    <section class="controls">
      <div class="month-nav">
        <button class="nav-btn" id="prevMonthBtn" aria-label="Previous month">❮</button>
        <h2 id="monthLabel">September 2026</h2>
        <button class="nav-btn" id="nextMonthBtn" aria-label="Next month">❯</button>
        <button class="nav-btn primary" id="todayBtn">Today</button>
      </div>
      <div class="actions">
        <label class="file-label">
          <input type="file" id="csvFileInput" accept=".csv" style="display:none">
          <span>Import CSV</span>
        </label>
        <button id="exportBtn">Export Backup</button>
        <button id="resetBtn" class="danger">Reset Plan</button>
      </div>
    </section>

    <!-- Calendar -->
    <section class="calendar-section">
      <div class="calendar">
        <div class="calendar-header">
          <div class="weekday-header">SUN</div>
          <div class="weekday-header">MON</div>
          <div class="weekday-header">TUE</div>
          <div class="weekday-header">WED</div>
          <div class="weekday-header">THU</div>
          <div class="weekday-header">FRI</div>
          <div class="weekday-header">SAT</div>
        </div>
        <div class="calendar-grid" id="calendarGrid">
          <!-- Dynamically populated by script.js -->
        </div>
      </div>
    </section>

    </div>

  </div>

  <script src="readings-data.js"></script>
  <script src="quotes-data.js"></script>
  <script src="script.js"></script>
  <script>
    // Sidebar open/close toggle (self-contained, does not touch script.js)
    (function () {
      var sidebar = document.getElementById('sidebar');
      var toggleBtn = document.getElementById('sidebarToggleBtn');
      if (!sidebar || !toggleBtn) return;

      toggleBtn.addEventListener('click', function () {
        var collapsed = sidebar.classList.toggle('collapsed');
        toggleBtn.setAttribute('aria-expanded', String(!collapsed));
        toggleBtn.setAttribute('aria-label', collapsed ? 'Open sidebar' : 'Close sidebar');
      });
    })();
  </script>
</body>
</html>
