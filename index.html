<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Plan</title>
  <link rel="stylesheet" href="style.css">
  <!-- Load a clean, modern font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="top-bar">
      <div class="logo">
        <span class="icon">✝</span>
        <h1>Bible Plan</h1>
      </div>
      <div class="quote-container" id="quoteContainer">
        <!-- Motivational quote injected here -->
      </div>
      <div class="clock" id="clock">
        <div id="clockTime" class="time">--:--</div>
        <div id="clockDate" class="date">--</div>
      </div>
    </header>

    <!-- Controls Toolbar -->
    <section class="toolbar">
      <div class="month-nav">
        <h2 id="currentMonthLabel">Bible Reading Plan</h2>
        <button id="todayBtn">Today</button>
      </div>
      <div class="actions">
        <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
        <button id="importBtn" class="btn-secondary">Import CSV</button>
        <button id="exportBtn" class="btn-secondary">Export Backup</button>
        <button id="resetBtn" class="btn-danger">Reset Plan</button>
      </div>
    </section>

    <!-- Calendar Grid View -->
    <main class="calendar-wrapper">
      <!-- Weekday Headers -->
      <div class="calendar-headers">
        <div>SUN</div>
        <div>MON</div>
        <div>TUE</div>
        <div>WED</div>
        <div>THU</div>
        <div>FRI</div>
        <div>SAT</div>
      </div>
      <!-- Days Grid -->
      <div id="calendarGrid" class="calendar-grid"></div>
    </main>
  </div>

  <!-- Load data files first, then the app script -->
  <script src="readings-data.js"></script>
  <script src="quotes-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
