<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Bible Plan</title>
  <meta
    name="description"
    content="A daily Bible reading calendar with drag-to-reorder days and progress tracking."
  >

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="app-header">

      <div class="brand">
        <svg
          class="cross-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <line x1="12" y1="2" x2="12" y2="22"/>
          <line x1="5" y1="8" x2="19" y2="8"/>
        </svg>

        <div>
          <h1>Bible Plan</h1>
          <h4>by Jason Christopher Hukom</h4>
        </div>
      </div>

      <div class="clock">
        <div class="clock-date" id="clockDate">&nbsp;</div>
        <div class="clock-time" id="clockTime">&nbsp;</div>
      </div>

    </header>


    <!-- QUOTE -->
    <section class="quote-banner" aria-live="polite">
      <p class="quote-text" id="quoteText"></p>
      <p class="quote-source" id="quoteSource"></p>
    </section>


    <!-- PROGRESS -->
    <section class="progress-section" aria-label="Reading progress">

      <div class="progress-stats">
        <span id="progressCount">0 / 0 days read</span>
        <span id="progressVerses">0 verses read</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

    </section>


    <!-- CALENDAR -->
    <main class="calendar-section">

      <div class="calendar-scroll">

        <div class="calendar">

          <div class="calendar-weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>

        </div>

      </div>

    </main>

  </div>


  <!-- JUMP TO TODAY -->
  <button
    type="button"
    class="jump-today"
    id="jumpToday"
  >
    Today
  </button>


  <!-- DATA -->
  <script src="readings-data.js"></script>
  <script src="quotes-data.js"></script>

  <script src="script.js"></script>

</body>
</html>
